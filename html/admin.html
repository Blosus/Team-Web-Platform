<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recetario - Agregar</title>
  <link rel="stylesheet" href="/css/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <h1>Agregar Receta</h1>
      </div>
      <div class="actions">
        <button id="btnLogout">Salir</button>
      </div>
    </div>
  </header>

  <main class="container admin-main">
    <div class="form-panel">
      <form id="formReceta">
        <input id="txtId" placeholder="ID" />
        <input id="txtNombre" placeholder="Nombre de la receta" required />
        <input id="txtCategoria" placeholder="Categoría (ej. Postre)" />
        <textarea id="txtDescripcion" placeholder="Descripcion corta"></textarea>
        <textarea id="txtIngredientes" placeholder="Ingredientes (uno por linea)"></textarea>
        <textarea id="txtPasos" placeholder="Pasos (uno por linea)"></textarea>
        <input readonly id="txtUrl" placeholder="URL imagen" />
        <input type="file" id="imageInput" />
        <button type="button" id="uploadButton">Subir imagen</button>
        <div class="form-buttons">
          <button type="button" id="btnAgregar">Agregar</button>
          <button type="button" id="btnBuscar">Buscar</button>
          <button type="button" id="btnActualizar">Actualizar</button>
          <button type="button" id="btnBorrar">Borrar</button>
          <button type="reset" id="btnLimpiar">Limpiar</button>
        </div>
        <p id="mensaje" class="mensaje"></p>
      </form>
    </div>

    <div class="table-panel">
      <table id="tablaRecetas">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Categoria</th>
            <th>Imagen</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Todos los derechos reservados para @ Franco Medina & Veloso Ramirez & Valdez Flores.</p>
    </div>
  </footer>

</body>

</html>
