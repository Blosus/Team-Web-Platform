<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contacto - Recetario</title>
    <link rel="stylesheet" href="/css/contacto.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <h1>Contacto</h1>
            </div>
            <nav class="main-nav">
                <a href="/index.html">Inicio</a>
            </nav>
        </div>
    </header>

    <main class="container">

        <form action="https://formsubmit.co/2023030529@upsin.edu.mx" method="POST" class="contact-card">
            <input name="nombre" placeholder="Nombre" required>
            <input name="correo" type="email" placeholder="Correo electrónico" required>
            <input name="telefono" placeholder="Teléfono" required>
            <textarea name="mensaje" placeholder="Mensaje" rows="5" required></textarea>


            <button type="submit">Enviar</button>
        </form>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Todos los derechos reservados para @ Franco Medina & Veloso Ramirez & Valdez Flores.</p>
        </div>
    </footer>
</body>

</html>
